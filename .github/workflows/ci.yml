name: CI

# `test` runs on every push: typecheck, the Vitest suite (including the
# committed Qiskit reference fixtures, so no Python needed) and the build.
# Regenerating those fixtures with Qiskit is validate.yml, which runs only
# when the code or data behind them changes.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: No upstream brand in the bundle
        run: "! grep -ril quantiom dist/"
