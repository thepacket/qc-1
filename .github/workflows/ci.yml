name: CI

# `test` runs on every push: typecheck, the Vitest suite (including the
# committed Qiskit reference fixtures, so no Python needed) and the build.
# `validate` regenerates those fixtures with the pinned Qiskit stack and
# fails if they drift. It never commits anything.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: No upstream brand in the bundle
        run: "! grep -ril quantiom dist/"

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: validation/requirements.txt
      - run: npm ci
      - name: Reference stack
        run: |
          python -m venv validation/.venv
          validation/.venv/bin/pip install -r validation/requirements.txt
      - run: npm run validate
      - name: Fixtures must not drift
        run: git diff --exit-code --stat test/fixtures
