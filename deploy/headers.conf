# Security headers, included in every location (nginx drops server-level
# add_header directives in any location that sets its own).
# No 'unsafe-eval': angle expressions are parsed, not compiled (src/sim/expr.ts);
# only the plot-program sandbox evaluates code, under its own policy
# (plot-host-headers.conf). 'unsafe-inline' styles: React style attributes (bars).
# connect-src openrouter.ai: the AI chat calls it from the browser with the
# user's own key (src/ai/openrouter.ts); nothing else is reachable.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; worker-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://openrouter.ai; manifest-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
