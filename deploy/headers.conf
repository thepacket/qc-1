# Security headers, included in every location (nginx drops server-level
# add_header directives in any location that sets its own).
# 'unsafe-eval': the angle evaluator (src/sim/expr.ts) compiles expressions
# with new Function. 'unsafe-inline' styles: React style attributes (bars).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; worker-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
