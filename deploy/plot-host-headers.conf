# Headers for the plot-program sandbox host worker only (assets/plotHost-*.js,
# src/analysis/plotHost.ts). The user's plot code runs in a data: worker this
# script starts; that worker has an opaque origin and inherits this policy:
# no network (default-src 'none' covers connect-src), no script loads at all
# (not even same-origin: import() would be a request), no nested workers but
# its own data: runner, eval for the user's code. The runner checks both
# before running anything. Keep in sync with PLOT_HOST_CSP in vite.config.ts.
add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-eval'; worker-src data:" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cache-Control "public, max-age=31536000, immutable";
