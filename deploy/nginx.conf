server {
  listen 8080;
  root /usr/share/nginx/html;
  server_tokens off;

  gzip on;
  gzip_comp_level 6;
  gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

  location = /health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # The plot-program sandbox host: its own, stricter policy (see the snippet).
  location ~ ^/assets/plotHost-[A-Za-z0-9_-]+\.js$ {
    include /etc/nginx/snippets/plot-host-headers.conf;
  }

  # Hashed build assets never change.
  location /assets/ {
    include /etc/nginx/snippets/headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # The service worker, its registration and the entry points must always
  # revalidate, or installed apps never see an update.
  location ~ ^/(sw\.js|registerSW\.js|index\.html)$ {
    include /etc/nginx/snippets/headers.conf;
    add_header Cache-Control "no-cache";
  }

  location = /manifest.webmanifest {
    include /etc/nginx/snippets/headers.conf;
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
  }

  location / {
    include /etc/nginx/snippets/headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
